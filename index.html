<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Panabeswar Bidhansabha – Mondal Directory</title>

<style>
:root{
    --bg:#fffaf2;
    --card:#fff;
    --tx:#1a1f2b;
    --mu:#5f6b7a;
    --sf:#ff9933;
    --gr:#138808;
    --nv:#000080;
    --ac:#138808;
    --bd:#eadfcf;
    --chip:#eaf6e8;
    --chip2:#fff1e0;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
}

@media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
        --bg:#10141c;
        --card:#1a202b;
        --tx:#eef0f3;
        --mu:#9aa3af;
        --sf:#ffa94d;
        --gr:#3ccf4e;
        --nv:#9fb0ff;
        --ac:#3ccf4e;
        --bd:#2c3442;
        --chip:#14301a;
        --chip2:#38260f;
    }
}

:root[data-theme="dark"]{
    --bg:#10141c;
    --card:#1a202b;
    --tx:#eef0f3;
    --mu:#9aa3af;
    --sf:#ffa94d;
    --gr:#3ccf4e;
    --nv:#9fb0ff;
    --ac:#3ccf4e;
    --bd:#2c3442;
    --chip:#14301a;
    --chip2:#38260f;
}

*{
    box-sizing:border-box;
}

html{
    scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--tx);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* TOP FLAG */
.flag{
    height:8px;
    background:linear-gradient(
        90deg,
        var(--sf) 0 33.3%,
        #fff 33.3% 66.6%,
        var(--gr) 66.6%
    );
    border-bottom:1px solid var(--bd);
}

/* HEADER */
header{
    max-width:900px;
    margin:auto;
    padding:18px 16px 8px;
    text-align:center;
}

.ch{
    font-size:30px;
    color:var(--nv);
    line-height:1;
}

h1{
    margin:4px 0 0;
    font-size:24px;
    background:linear-gradient(
        90deg,
        var(--sf),
        var(--nv) 50%,
        var(--gr)
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.sub{
    color:var(--mu);
    font-size:13px;
    margin-top:2px;
}

#q{
    width:100%;
    margin-top:12px;
    padding:11px 14px;
    border:1.5px solid var(--sf);
    border-radius:12px;
    background:var(--card);
    color:var(--tx);
    font-size:15px;
    outline:none;
}

#q:focus{
    border-color:var(--gr);
}

/* MAIN CARDS */
main{
    max-width:900px;
    margin:auto;
    padding:8px 16px 40px;
    display:grid;
    gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
}

.card{
    background:var(--card);
    border:1px solid var(--bd);
    border-top:5px solid;
    border-image:linear-gradient(
        90deg,
        var(--sf) 33%,
        #ccc 33% 66%,
        var(--gr) 66%
    ) 1;
    border-radius:4px;
    padding:16px;
    cursor:pointer;
    transition:transform .1s;
    box-shadow:0 1px 4px rgba(0,0,128,.07);
}

.card:active{
    transform:scale(.98);
}

.tag{
    display:inline-block;
    background:var(--sf);
    color:#1a1f2b;
    font-weight:700;
    font-size:12px;
    padding:3px 10px;
    border-radius:99px;
}

.pn{
    font-size:17px;
    font-weight:700;
    margin:10px 0 2px;
    color:var(--tx);
}

.role{
    color:var(--nv);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:600;
}

.ph{
    color:var(--gr);
    font-weight:700;
    margin-top:4px;
}

.meta{
    color:var(--mu);
    font-size:12px;
    margin-top:10px;
}

/* BOTTOM SHEET */
#ov{
    position:fixed;
    inset:0;
    background:rgba(0,0,40,.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:9;
}

#ov.on{
    display:flex;
}

.sheet{
    background:var(--bg);
    width:100%;
    max-width:760px;
    max-height:90%;
    overflow:auto;
    border-radius:20px 20px 0 0;
    padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));
}

.sheet .flag{
    margin:0 -16px 14px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
}

.x{
    border:0;
    background:var(--card);
    color:var(--tx);
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    border:1px solid var(--bd);
}

/* ANCHAL */
.an{
    margin:18px 0 8px;
    font-size:12px;
    font-weight:700;
    color:var(--nv);
    letter-spacing:.05em;
    padding-left:8px;
    border-left:4px solid var(--sf);
}

/* SHAKTIKENDRA */
.sk{
    background:var(--card);
    border:1px solid var(--bd);
    border-left:4px solid var(--gr);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
}

.skh{
    display:flex;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
}

.skn{
    font-weight:700;
}

.skp{
    color:var(--nv);
    font-size:11px;
    font-weight:600;
    letter-spacing:.04em;
}

/* WHATSAPP LINKS */
a{
    color:var(--gr);
    text-decoration:none;
    font-weight:700;
}

.whatsapp{
    display:inline-flex;
    align-items:center;
    gap:4px;
    color:#138808;
    cursor:pointer;
}

/* BOOTHS */
.chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.chip{
    background:var(--chip2);
    color:var(--tx);
    border:1px solid var(--sf);
    border-radius:8px;
    padding:3px 9px;
    font-size:13px;
    font-weight:600;
}

.chip:nth-child(3n+2){
    background:var(--card);
    border-color:var(--nv);
}

.chip:nth-child(3n){
    background:var(--chip);
    border-color:var(--gr);
}

.bl{
    margin-top:10px;
    display:grid;
    gap:6px;
}

.br{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:13px;
    border-top:1px solid var(--bd);
    padding-top:6px;
}

.empty{
    color:var(--mu);
    font-size:13px;
    margin-top:8px;
}

/* STATUS */
.st{
    max-width:900px;
    margin:0 auto;
    padding:4px 16px;
    text-align:center;
    color:var(--mu);
    font-size:13px;
}

.error{
    color:#c62828;
    font-weight:600;
    padding:12px;
    background:#ffebee;
    border-radius:10px;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="flag"></div>

<header>
    <div class="ch">☸</div>

    <h1>Panabeswar Bidhansabha</h1>

    <div class="sub">
        Mondal Directory · tap a card for Shaktikendra Pramukh &amp; booths
    </div>

    <input
        id="q"
        type="search"
        placeholder="Search mondal, president, pramukh, booth no…"
    >
</header>

<div id="st" class="st"></div>

<main id="list"></main>

<div id="ov">
    <div class="sheet" id="sh"></div>
</div>

<script>

/* =========================================================
   DATA SOURCE
   ========================================================= */

const CSV_FILE = "./data.csv";

let D = [];


/* =========================================================
   HTML ESCAPE
   ========================================================= */

const e = s =>
    String(s ?? "").replace(
        /[&<>"]/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;"
        }[c])
    );


/* =========================================================
   WHATSAPP LINK
   ========================================================= */

function whatsapp(phone){

    if(!phone){
        return "";
    }

    /*
       Remove spaces, +, -, brackets etc.
       Example:
       95935 07545
       becomes:
       9593507545
    */

    let number = String(phone).replace(/\D/g,"");

    if(!number){
        return "";
    }

    /*
       Indian 10 digit number
       automatically becomes 91XXXXXXXXXX
    */

    if(number.length === 10){
        number = "91" + number;
    }

    return `
        <a
            class="whatsapp"
            href="https://wa.me/${number}"
            target="_blank"
            rel="noopener noreferrer"
            onclick="event.stopPropagation()"
        >
            💬 ${e(phone)}
        </a>
    `;
}


/* =========================================================
   ELEMENT HELPER
   ========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text){

    text = text.replace(/^\uFEFF/,"");

    const rows = [];

    let row = [];
    let field = "";
    let quoted = false;

    for(let i = 0; i < text.length; i++){

        const c = text[i];

        if(quoted){

            if(c === '"'){

                if(text[i + 1] === '"'){
                    field += '"';
                    i++;
                }else{
                    quoted = false;
                }

            }else{

                field += c;

            }

        }else{

            if(c === '"'){

                quoted = true;

            }else if(c === ","){

                row.push(field);
                field = "";

            }else if(c === "\n" || c === "\r"){

                if(c === "\r" && text[i + 1] === "\n"){
                    i++;
                }

                row.push(field);
                rows.push(row);

                row = [];
                field = "";

            }else{

                field += c;

            }
        }
    }

    if(field !== "" || row.length){

        row.push(field);
        rows.push(row);

    }

    return rows;
}


/* =========================================================
   BUILD DATA
   ========================================================= */

function build(text){

    const rows = parseCSV(text);

    if(!rows.length){
        return [];
    }

    const H = rows[0].map(
        h => h.trim().toLowerCase()
    );

    const ix = name => H.indexOf(name);

    const c = {

        m:  ix("mondal"),

        p:  ix("president"),

        pm: ix("mobile"),

        a:  ix("anchal"),

        sl: ix("sl no"),

        sn: ix("shaktikendra name"),

        sp: ix("shaktikendra contact"),

        bn: ix("booth no"),

        bs: ix("booth savapati name"),

        bc: ix("booth contact")

    };


    const get = (r,key) => {

        if(c[key] < 0){
            return "";
        }

        return (r[c[key]] || "").trim();

    };


    const M = new Map();


    rows.slice(1).forEach(r => {

        const mn = get(r,"m");

        if(!mn){
            return;
        }


        /* -------------------------
           MONDAL
        ------------------------- */

        let m = M.get(mn);

        if(!m){

            m = {

                n:mn,

                pres:get(r,"p"),

                ph:get(r,"pm"),

                a:[],

                am:new Map()

            };

            M.set(mn,m);

        }


        if(!m.pres){
            m.pres = get(r,"p");
        }

        if(!m.ph){
            m.ph = get(r,"pm");
        }


        /* -------------------------
           ANCHAL
        ------------------------- */

        const an = get(r,"a") || "—";

        let a = m.am.get(an);

        if(!a){

            a = {

                n:an,

                s:[],

                sm:new Map()

            };

            m.am.set(an,a);

            m.a.push(a);

        }


        /* -------------------------
           SHAKTIKENDRA
        ------------------------- */

        const sn = get(r,"sn");

        const sp = get(r,"sp");

        const key = sn
            ? sn + "|" + sp
            : "sl:" + get(r,"sl");


        let k = a.sm.get(key);

        if(!k){

            k = {

                n:sn,

                ph:sp,

                b:[]

            };

            a.sm.set(key,k);

            a.s.push(k);

        }


        if(!k.ph){
            k.ph = sp;
        }


        /* -------------------------
           BOOTH
        ------------------------- */

        const no = get(r,"bn");

        if(no){

            k.b.push({

                no:no,

                n:get(r,"bs"),

                ph:get(r,"bc")

            });

        }

    });


    const out = [...M.values()];


    /* Sort booths */

    out.forEach(m => {

        m.a.forEach(a => {

            a.s.forEach(k => {

                k.b.sort(
                    (x,y) =>
                        (parseFloat(x.no) || 0) -
                        (parseFloat(y.no) || 0)
                );

            });

        });

    });


    /* Sort Mondal */

    out.sort(
        (x,y) =>
            x.n.localeCompare(
                y.n,
                undefined,
                {numeric:true}
            )
    );


    return out;
}


/* =========================================================
   COUNTS
   ========================================================= */

function cnt(m){

    let s = 0;
    let b = 0;

    m.a.forEach(a => {

        a.s.forEach(k => {

            if(k.n){
                s++;
            }

            b += k.b.length;

        });

    });

    return [s,b];
}


/* =========================================================
   SEARCH TEXT
   ========================================================= */

function hay(m){

    return (

        m.n +

        m.pres +

        m.ph +

        m.a.map(a =>

            a.n +

            a.s.map(k =>

                k.n +

                k.ph +

                k.b.map(x =>

                    x.no +

                    x.n +

                    x.ph

                ).join(" ")

            ).join(" ")

        ).join(" ")

    ).toLowerCase();
}


/* =========================================================
   RENDER MONDAL CARDS
   ========================================================= */

const list = $("list");


function render(filter = ""){

    list.innerHTML = D

        .map((m,i) => ({m,i}))

        .filter(o =>
            hay(o.m).includes(filter)
        )

        .map(({m,i}) => {

            const [s,b] = cnt(m);

            return `

                <div
                    class="card"
                    data-i="${i}"
                >

                    <span class="tag">
                        ${e(m.n)}
                    </span>

                    <div class="pn">
                        ${e(m.pres || "—")}
                    </div>

                    <div class="role">
                        President
                    </div>

                    <div class="ph">

                        ${
                            m.ph
                            ? whatsapp(m.ph)
                            : "—"
                        }

                    </div>

                    <div class="meta">

                        ${s} Shaktikendra Pramukh
                        ·
                        ${b} booths

                    </div>

                </div>

            `;

        })

        .join("")

        ||

        (
            D.length
                ? '<div class="empty">No results</div>'
                : ""
        );
}


/* =========================================================
   OPEN MONDAL
   ========================================================= */

function open_(i){

    const m = D[i];

    if(!m){
        return;
    }


    $("sh").innerHTML = `

        <div class="flag"></div>

        <div class="top">

            <div>

                <span class="tag">
                    ${e(m.n)}
                </span>

                <div class="pn">
                    ${e(m.pres || "—")}
                </div>

                <div class="role">
                    President
                </div>

                <div class="ph">

                    ${
                        m.ph
                        ? whatsapp(m.ph)
                        : "—"
                    }

                </div>

            </div>


            <button
                class="x"
                id="cl"
                aria-label="Close"
            >
                ✕
            </button>

        </div>

    `

    +

    m.a.map(a => `

        <div class="an">
            ${e(a.n)}
        </div>

        ${

            a.s.map(k => {

                const det =
                    k.b.filter(
                        x => x.n || x.ph
                    );


                return `

                    <div class="sk">

                        <div class="skh">

                            <div>

                                <div class="skp">
                                    SHAKTIKENDRA PRAMUKH
                                </div>

                                <div class="skn">

                                    ${
                                        k.n
                                        ? e(k.n)
                                        : "— not assigned —"
                                    }

                                </div>

                            </div>


                            <div>

                                ${
                                    k.ph
                                    ? whatsapp(k.ph)
                                    : ""
                                }

                            </div>

                        </div>


                        ${
                            k.b.length

                            ?

                            `
                            <div class="chips">

                                ${
                                    k.b.map(x => `

                                        <span class="chip">

                                            Booth ${e(x.no)}

                                        </span>

                                    `).join("")
                                }

                            </div>
                            `

                            :

                            `
                            <div class="empty">
                                No booths listed
                            </div>
                            `
                        }


                        ${
                            det.length

                            ?

                            `
                            <div class="bl">

                                ${
                                    det.map(x => `

                                        <div class="br">

                                            <span>

                                                <b>
                                                    ${e(x.no)}
                                                </b>

                                                ${
                                                    x.n
                                                    ? e(x.n)
                                                    : '<i style="color:var(--mu)">name n/a</i>'
                                                }

                                            </span>


                                            ${
                                                x.ph
                                                ? whatsapp(x.ph)
                                                : ""
                                            }

                                        </div>

                                    `).join("")
                                }

                            </div>
                            `

                            :

                            ""

                        }

                    </div>

                `;

            }).join("")

        }

    `).join("");


    $("ov").classList.add("on");


    $("cl").onclick = close_;

}


/* =========================================================
   CLOSE
   ========================================================= */

function close_(){

    $("ov").classList.remove("on");

}


/* =========================================================
   LOAD CSV
   ========================================================= */

function load(text){

    D = build(text);

    render(
        $("q").value.trim().toLowerCase()
    );


    $("st").innerHTML = `

        <strong>${D.length}</strong>
        mondals loaded from
        <strong>${e(CSV_FILE)}</strong>

    `;

}


/* =========================================================
   FETCH DATA.CSV
   NO FALLBACK
   NO LOCAL STORAGE
   ========================================================= */

function fetchCSV(){

    $("st").innerHTML = `
        Loading <strong>${e(CSV_FILE)}</strong>…
    `;


    fetch(
        CSV_FILE + "?t=" + Date.now()
    )

    .then(response => {

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        return response.text();

    })

    .then(text => {

        if(!text.trim()){

            throw new Error(
                "data.csv is empty"
            );

        }

        load(text);

    })

    .catch(error => {

        console.error(
            "Unable to load data.csv:",
            error
        );


        $("st").innerHTML = `

            <div class="error">

                Unable to load
                <strong>data.csv</strong>.

                <br><br>

                Please make sure
                <strong>index.html</strong>
                and
                <strong>data.csv</strong>
                are in the same folder
                and are being served through a web server.

                <br><br>

                Error:
                ${e(error.message)}

            </div>

        `;

        list.innerHTML = "";

    });

}


/* =========================================================
   MONDAL CARD CLICK
   ========================================================= */

list.addEventListener(
    "click",
    ev => {

        const card =
            ev.target.closest(".card");

        if(card){

            open_(
                Number(card.dataset.i)
            );

        }

    }
);


/* =========================================================
   CLOSE WHEN CLICKING OUTSIDE
   ========================================================= */

$("ov").addEventListener(
    "click",
    ev => {

        if(ev.target.id === "ov"){

            close_();

        }

    }
);


/* =========================================================
   SEARCH
   ========================================================= */

$("q").addEventListener(
    "input",
    ev => {

        render(
            ev.target.value
                .trim()
                .toLowerCase()
        );

    }
);


/* =========================================================
   START
   ========================================================= */

fetchCSV();

</script>

</body>
</html>
