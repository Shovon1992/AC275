const LS="mondal_csv_v1";
let D=[];
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const $=id=>document.getElementById(id);
function parseCSV(t){
 t=t.replace(/^\uFEFF/,"");const rows=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;
  else if(c==","){r.push(f);f=""}
  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}
  else f+=c}
 if(f!==""||r.length){r.push(f);rows.push(r)}
 return rows}
function build(text){
 const rows=parseCSV(text);if(!rows.length)return[];
 const H=rows[0].map(h=>h.trim().toLowerCase());
 const ix=n=>H.indexOf(n);
 const c={m:ix("mondal"),p:ix("president"),pm:ix("mobile"),a:ix("anchal"),sl:ix("sl no"),sn:ix("shaktikendra name"),sp:ix("shaktikendra contact"),bn:ix("booth no"),bs:ix("booth savapati name"),bc:ix("booth contact")};
 const g=(r,k)=>c[k]<0?"":(r[c[k]]||"").trim();
 const M=new Map();
 rows.slice(1).forEach(r=>{
  const mn=g(r,"m");if(!mn)return;
  let m=M.get(mn);if(!m){m={n:mn,pres:g(r,"p"),ph:g(r,"pm"),a:[],am:new Map()};M.set(mn,m)}
  if(!m.pres)m.pres=g(r,"p");if(!m.ph)m.ph=g(r,"pm");
  const an=g(r,"a")||"—";
  let a=m.am.get(an);if(!a){a={n:an,s:[],sm:new Map()};m.am.set(an,a);m.a.push(a)}
  const sn=g(r,"sn"),sp=g(r,"sp");
  const key=sn?sn+"|"+sp:"sl:"+g(r,"sl");
  let k=a.sm.get(key);if(!k){k={n:sn,ph:sp,b:[]};a.sm.set(key,k);a.s.push(k)}
  if(!k.ph)k.ph=sp;
  const no=g(r,"bn");if(no)k.b.push({no,n:g(r,"bs"),ph:g(r,"bc")});
 });
 const out=[...M.values()];
 out.forEach(m=>m.a.forEach(a=>a.s.forEach(k=>k.b.sort((x,y)=>(parseFloat(x.no)||0)-(parseFloat(y.no)||0)))));
 out.sort((x,y)=>x.n.localeCompare(y.n,undefined,{numeric:true}));
 return out}
const cnt=m=>{let s=0,b=0;m.a.forEach(a=>a.s.forEach(k=>{if(k.n)s++;b+=k.b.length}));return[s,b]};
const hay=m=>(m.n+m.pres+m.ph+m.a.map(a=>a.n+a.s.map(k=>k.n+k.ph+k.b.map(x=>x.no+x.n+x.ph).join(" ")).join(" ")).join(" ")).toLowerCase();
const list=$("list");
function render(f=""){
 list.innerHTML=D.map((m,i)=>({m,i})).filter(o=>hay(o.m).includes(f)).map(({m,i})=>{const[s,b]=cnt(m);
 return`<div class="card" data-i="${i}"><span class="tag">${e(m.n)}</span><div class="pn">${e(m.pres||"—")}</div><div class="role">President</div><div class="ph">📞 ${e(m.ph||"—")}</div><div class="meta">${s} Shaktikendra Pramukh · ${b} booths</div></div>`}).join("")||(D.length?'<div class="empty">No results</div>':"")}
function open_(i){const m=D[i];
 $("sh").innerHTML=`<div class="flag"></div><div class="top"><div><span class="tag">${e(m.n)}</span><div class="pn">${e(m.pres||"—")}</div><div class="role">President</div><div class="ph">${tel(m.ph)}</div></div><button class="x" id="cl">✕</button></div>`+
 m.a.map(a=>`<div class="an">${e(a.n)}</div>`+a.s.map(k=>{
  const det=k.b.filter(x=>x.n||x.ph);
  return`<div class="sk"><div class="skh"><div><div class="skp">SHAKTIKENDRA PRAMUKH</div><div class="skn">${k.n?e(k.n):"— not assigned —"}</div></div><div>${tel(k.ph)}</div></div>`+
  (k.b.length?`<div class="chips">${k.b.map(x=>`<span class="chip">Booth ${e(x.no)}</span>`).join("")}</div>`:'<div class="empty">No booths listed</div>')+
  (det.length?`<div class="bl">${det.map(x=>`<div class="br"><span><b>${e(x.no)}</b> ${x.n?e(x.n):'<i style="color:var(--mu)">name n/a</i>'}</span>${tel(x.ph)}</div>`).join("")}</div>`:"")+`</div>`}).join("")).join("");
 $("ov").classList.add("on");$("cl").onclick=close_}
function close_(){$("ov").classList.remove("on")}
function load(text,src,note){
 D=build(text);render($("q").value.trim().toLowerCase());
 $("st").innerHTML=`${D.length} mondals loaded from ${e(src)}${note?"<br>"+note:""} <button class="rl" id="rl">reload</button> <label class="rl" style="display:inline">choose file<input id="fi" type="file" accept=".csv,text/csv" hidden></label>`;
 bind()}
function bind(){
 const fi=$("fi");if(fi)fi.onchange=()=>{const f=fi.files[0];if(f)f.text().then(t=>{try{localStorage.setItem(LS,JSON.stringify({n:f.name,t}))}catch(x){}load(t,f.name)})};
 const rl=$("rl");if(rl)rl.onclick=fetchCSV}
function fetchCSV(){
 $("st").textContent="Loading "+CSV_FILE+"…";
 fetch(CSV_FILE+"?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{try{localStorage.setItem(LS,JSON.stringify({n:CSV_FILE,t}))}catch(x){}load(t,CSV_FILE)}).catch(()=>{
  const hint="Browser blocks auto-reading data.csv from a local file. Host both files on a website for automatic updates, or use “choose file”.";
  let c=null;try{c=JSON.parse(localStorage.getItem(LS))}catch(x){}
  if(c&&c.t)load(c.t,"saved copy of "+c.n,hint);else load(FALLBACK,"built-in copy of data.csv",hint)})}
list.addEventListener("click",ev=>{const c=ev.target.closest(".card");if(c)open_(+c.dataset.i)});

$("q").addEventListener("input",ev=>render(ev.target.value.trim().toLowerCase()));
fetchCSV();
