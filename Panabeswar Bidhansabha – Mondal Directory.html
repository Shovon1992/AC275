<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panabeswar Bidhansabha – Mondal Directory</title>
<style>
:root{--bg:#fffaf2;--card:#fff;--tx:#1a1f2b;--mu:#5f6b7a;--sf:#ff9933;--gr:#138808;--nv:#000080;--ac:#138808;--bd:#eadfcf;--chip:#eaf6e8;--chip2:#fff1e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202b;--tx:#eef0f3;--mu:#9aa3af;--sf:#ffa94d;--gr:#3ccf4e;--nv:#9fb0ff;--ac:#3ccf4e;--bd:#2c3442;--chip:#14301a;--chip2:#38260f}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202b;--tx:#eef0f3;--mu:#9aa3af;--sf:#ffa94d;--gr:#3ccf4e;--nv:#9fb0ff;--ac:#3ccf4e;--bd:#2c3442;--chip:#14301a;--chip2:#38260f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.flag{height:8px;background:linear-gradient(90deg,var(--sf) 0 33.3%,#fff 33.3% 66.6%,var(--gr) 66.6%);border-bottom:1px solid var(--bd)}
header{max-width:900px;margin:auto;padding:18px 16px 8px;text-align:center}
.ch{font-size:30px;color:var(--nv);line-height:1}
h1{margin:4px 0 0;font-size:24px;background:linear-gradient(90deg,var(--sf),var(--nv) 50%,var(--gr));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
#q{width:100%;margin-top:12px;padding:11px 14px;border:1.5px solid var(--sf);border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;outline:none}
#q:focus{border-color:var(--gr)}
main{max-width:900px;margin:auto;padding:8px 16px 40px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-top:5px solid;border-image:linear-gradient(90deg,var(--sf) 33%,#ccc 33% 66%,var(--gr) 66%) 1;border-radius:4px;padding:16px;cursor:pointer;transition:transform .1s;box-shadow:0 1px 4px rgba(0,0,128,.07)}
.card:active{transform:scale(.98)}
.tag{display:inline-block;background:var(--sf);color:#1a1f2b;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px}
.pn{font-size:17px;font-weight:700;margin:10px 0 2px;color:var(--tx)}.role{color:var(--nv);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ph{color:var(--gr);font-weight:700;margin-top:4px}.meta{color:var(--mu);font-size:12px;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .flag{margin:0 -16px 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.x{border:0;background:var(--card);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;border:1px solid var(--bd)}
.an{margin:18px 0 8px;font-size:12px;font-weight:700;color:var(--nv);letter-spacing:.05em;padding-left:8px;border-left:4px solid var(--sf)}
.sk{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gr);border-radius:10px;padding:12px;margin-bottom:10px}
.skh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.skn{font-weight:700}.skp{color:var(--nv);font-size:11px;font-weight:600;letter-spacing:.04em}
a{color:var(--gr);text-decoration:none;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip2);color:var(--tx);border:1px solid var(--sf);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600}
.chip:nth-child(3n+2){background:var(--card);border-color:var(--nv)}
.chip:nth-child(3n){background:var(--chip);border-color:var(--gr)}
.bl{margin-top:10px;display:grid;gap:6px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--bd);padding-top:6px}
.empty{color:var(--mu);font-size:13px;margin-top:8px}
</style></head><body>

const D=[];let M,A;
RAW.split("\n").forEach(l=>{const p=l.split("|");
if(p[0]=="M"){M={n:p[1],pres:p[2],ph:p[3],a:[]};D.push(M)}
else if(p[0]=="A"){A={n:p[1],s:[]};M.a.push(A)}
else{A.s.push({n:p[1],ph:p[2],b:(p[3]||"").split(",").filter(Boolean).map(x=>{const t=x.split("~");return{no:t[0],n:t[1]||"",ph:t[2]||""}})})}});

const tel=p=>p?`<a href="tel:${e(p)}">${e(p)}</a>`:"";

m.a.map(a=>`<div class="an">${e(a.n)}</div>`+a.s.map((k,j)=>{
const plain=k.b.filter(x=>!x.n&&!x.ph),det=k.b.filter(x=>x.n||x.ph);
